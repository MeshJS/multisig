name: Bundle budget

# Fails a PR when first-load JavaScript grows past scripts/bundle-budget.json.
# The shared bundle once reached 11.9 MB gzipped on every page because a single
# static import inlined ~15 MB of WASM, and nothing noticed. This makes the next
# one a red check.

on:
  pull_request:
    branches: [preprod, main]

concurrency:
  group: bundle-budget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  budget:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Use repo npm version
        run: npm install -g "$(node -p 'require("./package.json").packageManager')" && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Check first-load budget
        run: node scripts/check-bundle-budget.mjs
